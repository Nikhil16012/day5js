<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: arial;
            padding: 20px;
        }
        input{
            width:300px;
            padding: 10px;
        }
        #results{
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <input type="text" id="searchBox" placeholder="type something"/>
    <div id="results">Results:</div>
    <script>
        const logger=(type)=>(message)=>{
            console.log(`(${type.toUpperCase()})-${message}`);
        }
        const infoLog = logger("info");
        function debounce(fn,delay){
            let timer;
            return function(...args){
                clearTimeout(timer)
                timer=setTimeout(()=>fn.apply(this,args),delay);
            }
        }
        function throttle(fn,interval){
            let lastCall=0;
            return function(...args){
                const now=Date.now();
                if(now-lastCall>=interval){
                    lastCall=now
                    fn.apply(this,args);
                }
            }

        }
        function simulateFetch(query){
            return new Promise((resolve)=>{
                setTimeout(()=>{
                    resolve([query.toUpperCase(),'RESULT1','RESULT2'])

                },200)
            })
        }
       // function processResult(result){
          //  return result.map(r=>r.trim())
        //}
        function displayresult(result){
            const resultBox=document.getElementById("results")
            resultBox.textContent=`Results:${result.join(',')}`
        }
        const handlesearch=debounce((query)=>{
            if(!query) return;
            infoLog("Debounce triggered");
            simulateFetch(query).then(displayresult)
        },3000);
        const logKeystroke = throttle((query)=>{
            infoLog(`Throttled keystroke: ${query}`)
        },300)
        document.getElementById("searchBox").addEventListener("input",(e)=>{
            const query=e.target.value;
            logKeystroke(query);
            handlesearch(query);
        });

        
    </script>
</body>
</html>
